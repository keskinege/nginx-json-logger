# Demo server for jsonlog on a VM. Dropped into conf.d/ by `install.sh --demo`,
# so the usual `include /etc/nginx/conf.d/*.conf;` picks it up.
#
# WARNING: test only. It trusts a public HS256 secret, listens on plain HTTP 8080
# and exposes a static JWKS. Do not use this block in production.

map $jwt_claim_iss $jl_valid_issuer {
    default                     0;
    "https://dummy-idp.local"   1;
}

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /_jwks {
        internal;
        alias /etc/nginx/conf.d/jsonlog/jwks.json;
        default_type application/json;
    }

    location /api/ {
        include /etc/nginx/conf.d/jsonlog/location.conf;

        set $jl_expected_issuer   "https://dummy-idp.local";
        set $jl_expected_audience "api";
        set $jl_allowed_algs      "HS256,RS256";

        auth_jwt            "api";
        auth_jwt_key_request /_jwks;
        auth_jwt_key_cache  1h;
        auth_jwt_leeway     30s;
        auth_jwt_require    $jl_valid_issuer;

        return 200 "authenticated\n";
    }

    location /open/ {
        include /etc/nginx/conf.d/jsonlog/location.conf;
        return 200 "open\n";
    }
}
