apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: jsonlog-test
  name: jsonlog-httpbin
  labels:
    app.kubernetes.io/name: jsonlog-httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jsonlog-httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jsonlog-httpbin
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /get, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  namespace: jsonlog-test
  name: jsonlog-httpbin
  labels:
    app.kubernetes.io/name: jsonlog-httpbin
spec:
  selector:
    app.kubernetes.io/name: jsonlog-httpbin
  ports:
    - name: http
      port: 8080
      targetPort: http
