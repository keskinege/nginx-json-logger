js_path  /etc/nginx/conf.d/jsonlog/;
js_import jsonlog from jsonlog.js;

js_var $jl_req_body    '';
js_var $jl_req_meta    '';
js_var $jl_rsp_body    '';
js_var $jl_rsp_meta    '';
js_var $jl_rsp_headers '';
js_var $jl_jwt         '';
js_var $jl_errors      '';

js_set $jsonlog jsonlog.emit;

log_format jsonlog escape=none '$jsonlog';
access_log /dev/stdout jsonlog;
