load_module modules/ngx_http_js_module.so;

worker_processes 1;
daemon off;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/conf.d/jsonlog/http.conf;

    upstream httpbin { server jsonlog-httpbin:8080; }

    # Mirror of the dummy IdP issuer from nginx-demos/api-steering.
    map $jwt_claim_iss $jl_valid_issuer {
        default                     0;
        "https://dummy-idp.local"   1;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Static JWKS from the dummy IdP (kty=oct, kid=0001).
        location = /_jwks {
            internal;
            alias /etc/nginx/conf.d/jsonlog/jwks.json;
            default_type application/json;
        }

        # JWT-protected: native auth_jwt + our logger's observed validation.
        location /api/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;

            set $jl_expected_issuer   "https://dummy-idp.local";
            set $jl_expected_audience "api";
            set $jl_allowed_algs      "HS256,RS256";

            auth_jwt            "api";
            auth_jwt_key_request /_jwks;
            auth_jwt_key_cache  1h;
            auth_jwt_leeway     30s;
            auth_jwt_require    $jl_valid_issuer;

            proxy_pass http://httpbin/;
        }

        # Logging only, no auth.
        location /open/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;
            proxy_pass http://httpbin/;
        }
    }
}
