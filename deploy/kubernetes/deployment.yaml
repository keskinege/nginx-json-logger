apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: jsonlog-test
  name: jsonlog-nginx
  labels:
    app.kubernetes.io/name: jsonlog-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jsonlog-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jsonlog-nginx
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: private-registry.nginx.com/nginx-ic-nap-v5/nginx-plus-ingress:5.6.3
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/jsonlog
              readOnly: true
            - name: license
              mountPath: /etc/nginx/license.jwt
              subPath: license.jwt
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jsonlog-config
        - name: license
          secret:
            secretName: nplus-license
            items:
              - key: license.jwt
                path: license.jwt
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
