set $jl_upstream_scheme      "";
set $jl_upstream_url         "";
set $jl_upstream_host_header "";
set $jl_upstream_uri_mapped  "0";

js_access         jsonlog.request;
js_header_filter  jsonlog.responseHeaders;
js_body_filter    jsonlog.responseBody buffer_type=buffer;

client_body_buffer_size 32k;
proxy_set_header X-Request-ID $request_id;
