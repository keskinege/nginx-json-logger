load_module modules/ngx_http_js_module.so;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/conf.d/jsonlog/http.conf;

    upstream orders_api {
        server backend:8080;
        server 127.0.0.1:1;      # dead peer exercises retry and peer-list reporting
    }

    server {
        listen 8080;
        server_name _;

        location = /__unit {
            js_import unit from unit/run.js;
            js_content unit.run;
        }

        location /api/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;
            proxy_pass http://orders_api;
        }

        location /stream/ {
            include /etc/nginx/conf.d/jsonlog/no-body.conf;
            proxy_pass http://orders_api/stream/;
        }

        location /api/override/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;
            set $jl_upstream_url "https://orders.internal:8443/v1/orders";
            proxy_pass http://orders_api/;
        }

        location /api/mapped/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;
            set $jl_upstream_uri_mapped "1";
            proxy_pass http://orders_api/v2/;
        }

        location /api/syslog/ {
            include /etc/nginx/conf.d/jsonlog/location.conf;
            include /etc/nginx/conf.d/jsonlog/syslog.conf;
            proxy_pass http://orders_api/;
        }
    }
}
