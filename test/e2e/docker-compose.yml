services:
  nginx:
    image: nginx-plus:r37
    volumes:
      - ./../conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./../conf/jsonlog:/etc/nginx/conf.d/jsonlog:ro
      - ./../njs:/etc/nginx/njs:ro
      - ./../test/unit:/etc/nginx/njs/unit:ro
      - ./../logs:/var/log/nginx
      - ${NGINX_LICENSE:-./../license.jwt}:/etc/nginx/license.jwt:ro
    ports: ["8088:8080"]
    depends_on: [backend]
  backend:
    image: mccutchen/go-httpbin
  udp-listener:
    image: python:3.12-alpine
    command: ["python3", "-u", "/udp_listen.py"]
    volumes: ["./udp_listen.py:/udp_listen.py:ro"]
